name: Build and Deploy

on:
  push:
    branches:
      - feature/backend-command-center-portfolio
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Backend check
        working-directory: apps/backend
        run: python manage.py check

      - name: Frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend checks
        working-directory: apps/frontend
        run: |
          npm run typecheck
          npm run build

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/feature/backend-command-center-portfolio'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_PATH }}
            git fetch origin feature/backend-command-center-portfolio
            git checkout feature/backend-command-center-portfolio
            git pull origin feature/backend-command-center-portfolio
            docker compose -f infra/docker-compose.yml up -d --build
